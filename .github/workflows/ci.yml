name: CI

# Every correctness guarantee in this repository — the backend parity suites, the
# index integrity suites, the pinned CRC and CSR format vectors, the race
# detector — was previously enforced only when a human remembered to run
# test.ps1, on Windows. This runs them on every push, on Linux, Windows and macOS.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:17 UTC nightly. Off the hour so it does not queue behind the crowd of
    # jobs everyone schedules at :00.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and vet run on Linux only. gofmt -l reports every file on a
  # Windows checkout that normalises line endings, which would be noise rather
  # than signal.
  lint:
    name: vet and gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # And again with the stress tag on, because nothing else in CI compiles
      # those files any more: the unit run cannot see them, and the test job now
      # runs only the tests that live in them. They are where the measurement
      # harness lives, so a rename in the engine breaks them silently and is
      # found the next time somebody tries to measure something.
      - name: go vet (stress tag)
        run: go vet -tags=stress ./...

  # macOS joined the matrix with the process lock. The engine now makes an
  # explicit claim about Darwin — flock semantics, and a reader/writer exclusion
  # that depends on them — and a platform claim nothing exercises is a guess.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Unit tests (race)
        run: go test ./... -race -count=1

      # The stress suite is behind a build tag, so `go test ./...` never compiles
      # it and it can rot unnoticed. The default path is 100k nodes / 500k edges
      # and finishes in well under a minute; the 1M-node path is separately gated
      # behind GRAPHENE_PERSISTENT_STRESS and runs in the scheduled job below.
      #
      # Only the tests that the tag adds. This step used to run the whole tests
      # package with the tag on, which re-ran the 479 tests the step above had
      # just finished for the sake of the 19 that exist only under it — 253
      # seconds of duplicate on windows, more than the unit run itself.
      #
      # The names are derived from the tree rather than written out here, for the
      # reason the fuzz matrix below gives at length: a hand-kept list of what to
      # run is a list that silently shrinks relative to what exists. A test in a
      # stress-tagged file is exactly a test that exists only under the tag, so
      # the set comes out of the files themselves and needs no build to find.
      # Names from another platform's file match nothing here, which is correct
      # rather than merely harmless: ceiling_windows_test.go is the windows
      # runner's to run.
      #
      # Compile rot in every other tagged file — disk's spikes, the whole
      # benchmark suite — is caught by `go vet -tags=stress ./...` in the lint
      # job: one command on one platform, rather than a run on three.
      - name: Stress-only tests (race)
        shell: bash
        run: |
          names=$(grep -l '^//go:build stress' tests/*_test.go | xargs grep -hoE '^func Test[A-Za-z0-9_]+' | sed 's/^func //' | grep -v '^TestMain$' | sort -u | paste -sd'|' -)
          if [ -z "$names" ]; then
            echo "no stress-only tests found; the filter that selects them is broken" >&2
            exit 1
          fi
          echo "stress-only tests: $names"
          go test ./tests/ -tags=stress -race -count=1 -run "^($names)$"

  # Benchmarks are not a pass/fail gate — benchmark timings are far too sensitive
  # to runner load to assert on, and CONTRIBUTING.md's method (interleaved A/B
  # against a control) cannot be run meaningfully on ephemeral CI hardware.
  # This runs each benchmark exactly once purely to prove they still compile and
  # do not panic, which is the failure mode that would otherwise go unnoticed.
  #
  # Nightly rather than per-push, and the half that was worth three minutes of
  # every push is now a vet: `go vet -tags=stress ./...` in the lint job proves
  # they compile, in seconds. What is left here is whether they *run* — a
  # benchmark that panics on its first iteration compiles perfectly -- and that
  # is worth a nightly and not a gate on a documentation commit.
  bench-smoke:
    name: benchmarks compile and run
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Benchmark smoke run
        run: go test ./tests/ ./index/ -tags=stress -bench=. -benchtime=1x -run='^$'

  # Fuzzing found three parser defects on its first run — two unbounded
  # allocations and an out-of-range index, all reachable from a file under 110
  # bytes. Seed corpora and saved crash reproducers already run as ordinary tests
  # on every push (they live in testdata/fuzz); this job explores for new ones.
  #
  # A failure here writes the offending input to testdata/fuzz. That file is the
  # bug report: commit it, and it becomes a permanent regression test.
  #
  # The matrix is derived from the tree rather than written out here. It was
  # written out here, and it drifted: three targets were added over time and the
  # list kept naming four, so the schema catalogue and both merkle parsers were
  # fuzzed by nobody while the job went on reporting success. A hand-maintained
  # list of what to test is a list that silently shrinks relative to what exists.
  fuzz-discover:
    name: discover fuzz targets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: List fuzz targets
        id: list
        run: |
          entries=""
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              entries="$entries{\"pkg\":\"$pkg\",\"target\":\"$target\"},"
            done
          done
          # An empty matrix is a job that passes without running anything, which
          # is the failure this whole arrangement exists to prevent.
          if [ -z "$entries" ]; then
            echo "no fuzz targets found; the discovery step is broken" >&2
            exit 1
          fi
          echo "matrix={\"include\":[${entries%,}]}" >> "$GITHUB_OUTPUT"
          echo "discovered: ${entries%,}"

  fuzz:
    name: fuzz parsers
    needs: fuzz-discover
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fuzz-discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.target }}
        run: go test ${{ matrix.pkg }} -run=XXX -fuzz=${{ matrix.target }} -fuzztime=5m

      - name: Upload any crash reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: "**/testdata/fuzz/**"

  # The 1M-node persistent path is too slow for every push but too valuable to
  # never run. Nightly, plus on demand.
  stress-deep:
    name: deep stress (1M nodes)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Deep stress
        env:
          GRAPHENE_PERSISTENT_STRESS: "1"
        run: go test ./tests/ -tags=stress -count=1 -run TestStress -timeout 50m

  # The memory programme's end-to-end acceptance: the consumer's own sequence
  # under the RAM ceiling it was sized for. Nightly beside the deep stress.
  #
  # Two arms, because only one of them holds at the full shape and both facts
  # matter. A 1,400,000-node store -- 1,689 MiB on disk, thirteen index entries
  # per node -- opens and scans in 561 MiB of anonymous memory under 2 GiB.
  # Rebuilding that whole layer in one process needs 3.9 GiB, because a
  # compaction leaves its own output resident until the store is reopened; see
  # docs/MEMORY_MODEL.md section 9. So the read-only arm runs at the full shape
  # and the write arm at one that fits, and neither hides the other.
  #
  # The fixtures are built first and outside the limit. A 1.4M-node build peaks
  # at several times what the finished store costs to open, so a run that built
  # its own would fail in the builder and say nothing about the store.
  #
  # These jobs fail when no ceiling is in force. That is the point: a step whose
  # limit silently failed to apply would run the workload unconstrained and go
  # green, which is the one outcome worse than a red one.
  ceiling-linux:
    name: 2 GiB ceiling (linux, cgroup v2)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BIG: /var/tmp/graphene-ceiling-big
      SMALL: /var/tmp/graphene-ceiling-small
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Compiled once and run under systemd-run, rather than running `go test`
      # as root inside the scope: the toolchain would then write its caches as
      # another user, and the thing under test is the store, not the build.
      - name: Compile the stress binary
        run: go test ./tests/ -tags=stress -c -o /tmp/graphene.test

      # The 1.4M fixture takes up to forty minutes to build and peaks near
      # 9.4 GiB doing it, which is most of a nightly run spent producing bytes
      # that did not change. So it is cached -- and the key is the whole of what
      # makes that safe.
      #
      # It hashes every package that decides what lands in the image. That is
      # deliberately more than the fixture builder: a change in disk/ or index/
      # can move a byte in the file without touching tests/, and a cache that
      # survived it would measure the previous format under this commit's name.
      # That is exactly the failure class G9 is about, reintroduced into the
      # instrument rather than into the engine.
      #
      # There is no restore-keys. A prefix match is how a cache usually degrades
      # gracefully, and here it degrades into silently measuring a store built by
      # different code -- the one outcome this job exists to rule out. A miss
      # should cost forty minutes, not correctness.
      #
      # The fixture's own shape marker is the backstop: it records the format
      # version the build wrote, and a run that opens a fixture from another
      # format fails rather than measuring it. Two independent checks, because
      # the cache key is a guess about what matters and the marker is a fact.
      - name: Restore the 1.4M fixture
        id: bigfixture
        uses: actions/cache@v4
        with:
          path: ${{ env.BIG }}
          key: ceiling-fixture-1400k-linux-${{ hashFiles('disk/**/*.go', 'index/**/*.go', 'store/**/*.go', 'tests/rss_bench_test.go', 'go.mod') }}

      - name: Build the 1.4M fixture, unconstrained
        if: steps.bigfixture.outputs.cache-hit != 'true'
        env:
          GRAPHENE_CEILING_BUILD: "1"
        run: |
          GRAPHENE_RSS_DIR=$BIG GRAPHENE_RSS_NODES=1400000 \
            /tmp/graphene.test -test.run '^TestCeilingFixture_Build$' -test.v -test.timeout 40m

      # The 200k fixture is not cached. It builds in well under a minute, and a
      # cache entry costs more to reason about than it saves.
      - name: Build the 200k fixture, unconstrained
        env:
          GRAPHENE_CEILING_BUILD: "1"
        run: |
          GRAPHENE_RSS_DIR=$SMALL GRAPHENE_RSS_NODES=200000 \
            /tmp/graphene.test -test.run '^TestCeilingFixture_Build$' -test.v -test.timeout 10m

      # systemd-run rather than `ulimit -v`: RLIMIT_AS bounds the virtual address
      # space, which counts every byte of the mapped image even though none of it
      # is charged to this process -- so it would refuse a store that fits, and
      # it constrains exactly the term this programme moved out of the way.
      # MemorySwapMax=0 matters as much as MemoryMax: a cgroup with swap pushes
      # anonymous pages out instead of failing, and the run then measures how
      # patient the disk is rather than whether the store fits.
      - name: Open and scan 1.4M nodes under 2 GiB
        run: |
          sudo systemd-run --scope --quiet --uid=$(id -u) --gid=$(id -g) \
            -p MemoryMax=2G -p MemorySwapMax=0 \
            env GRAPHENE_CEILING_MIB=2048 GRAPHENE_CEILING_READONLY=1 \
                GRAPHENE_RSS_DIR=$BIG GRAPHENE_RSS_NODES=1400000 \
            /tmp/graphene.test -test.run '^TestCeiling_' -test.v -test.timeout 30m

      - name: Rebuild and compact 200k nodes under 2 GiB
        run: |
          sudo systemd-run --scope --quiet --uid=$(id -u) --gid=$(id -g) \
            -p MemoryMax=2G -p MemorySwapMax=0 \
            env GRAPHENE_CEILING_MIB=2048 GRAPHENE_CEILING_DELTA_MIB=64 \
                GRAPHENE_RSS_DIR=$SMALL GRAPHENE_RSS_NODES=200000 \
            /tmp/graphene.test -test.run '^TestCeiling_' -test.v -test.timeout 30m

      # The third arm: the whole-layer rebuild at the full shape, which is the
      # release's end-to-end acceptance and the one that failed for two releases.
      # It passes with the delta bounded and a reopen after each interim
      # compaction -- 880.7 MiB of 2,048 with 57.0% headroom, measured on
      # windows; see docs/MEMORY_MODEL.md section 9.8, which also has the sweep
      # showing that no delta bound alone completes it, the bisection placing the
      # bound's cliff in (96, 128], and what GCPX moved.
      #
      # It was 1,285.2 MiB and 37.2% before the composite postings went into the
      # image. Both figures are on this configuration; the older one is what an
      # image written by v0.7.x still costs to rebuild, since a pre-GCPX image is
      # read exactly as it always was.
      #
      # continue-on-error until it has passed here. The figures above are from a
      # Job Object, which bounds commit charge; this is a cgroup, which bounds
      # resident pages, and the two are not the same instrument. A nightly that
      # went red on a difference between instruments would be turned off, and an
      # arm nobody reads is worse than one that is honest about being new. Drop
      # the flag once this is green, not before.
      - name: Rebuild 1.4M nodes under 2 GiB, reopening after each compaction
        continue-on-error: true
        run: |
          sudo systemd-run --scope --quiet --uid=$(id -u) --gid=$(id -g) \
            -p MemoryMax=2G -p MemorySwapMax=0 \
            env GRAPHENE_CEILING_MIB=2048 GRAPHENE_CEILING_DELTA_MIB=32 \
                GRAPHENE_CEILING_REOPEN=1 \
                GRAPHENE_RSS_DIR=$BIG GRAPHENE_RSS_NODES=1400000 \
            /tmp/graphene.test -test.run '^TestCeiling_' -test.v -test.timeout 60m

  # The same two arms on windows, where the harness applies its own Job Object
  # rather than being wrapped: a process may limit itself there without any
  # privilege, and there is no convenient way to do it from outside. The limit
  # is on commit charge, which a read-only file mapping does not count toward --
  # the same asymmetry as a page cache the kernel reclaims.
  ceiling-windows:
    name: 2 GiB ceiling (windows, Job Object)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # See the linux job for why this key hashes the engine's packages and
      # carries no restore-keys.
      - name: Restore the 1.4M fixture
        id: bigfixture
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/graphene-ceiling-big
          key: ceiling-fixture-1400k-windows-${{ hashFiles('disk/**/*.go', 'index/**/*.go', 'store/**/*.go', 'tests/rss_bench_test.go', 'go.mod') }}

      - name: Build the 1.4M fixture, unconstrained
        if: steps.bigfixture.outputs.cache-hit != 'true'
        env:
          GRAPHENE_CEILING_BUILD: "1"
        run: |
          $env:GRAPHENE_RSS_DIR = "$env:RUNNER_TEMP\graphene-ceiling-big"
          $env:GRAPHENE_RSS_NODES = "1400000"
          go test ./tests/ -tags=stress -run '^TestCeilingFixture_Build$' -v -count=1 -timeout 40m
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the 200k fixture, unconstrained
        env:
          GRAPHENE_CEILING_BUILD: "1"
        run: |
          $env:GRAPHENE_RSS_DIR = "$env:RUNNER_TEMP\graphene-ceiling-small"
          $env:GRAPHENE_RSS_NODES = "200000"
          go test ./tests/ -tags=stress -run '^TestCeilingFixture_Build$' -v -count=1 -timeout 10m
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Open and scan 1.4M nodes under 2 GiB
        env:
          GRAPHENE_CEILING_MIB: "2048"
          GRAPHENE_CEILING_READONLY: "1"
          GRAPHENE_RSS_NODES: "1400000"
        run: |
          $env:GRAPHENE_RSS_DIR = "$env:RUNNER_TEMP\graphene-ceiling-big"
          go test ./tests/ -tags=stress -run '^TestCeiling_' -v -count=1 -timeout 30m

      - name: Rebuild and compact 200k nodes under 2 GiB
        env:
          GRAPHENE_CEILING_MIB: "2048"
          GRAPHENE_CEILING_DELTA_MIB: "64"
          GRAPHENE_RSS_NODES: "200000"
        run: |
          $env:GRAPHENE_RSS_DIR = "$env:RUNNER_TEMP\graphene-ceiling-small"
          go test ./tests/ -tags=stress -run '^TestCeiling_' -v -count=1 -timeout 30m

      # The third arm. See the linux job for what it is and why it starts
      # non-blocking; this is the platform the figures in section 9.8 were taken
      # on, so it is the one expected to go green first. It stays
      # continue-on-error until it has done so on a runner rather than on the
      # machine the measurement was made on -- a hosted runner has less commit
      # available and a slower disk, and neither has been tried.
      - name: Rebuild 1.4M nodes under 2 GiB, reopening after each compaction
        continue-on-error: true
        env:
          GRAPHENE_CEILING_MIB: "2048"
          GRAPHENE_CEILING_DELTA_MIB: "32"
          GRAPHENE_CEILING_REOPEN: "1"
          GRAPHENE_RSS_NODES: "1400000"
        run: |
          $env:GRAPHENE_RSS_DIR = "$env:RUNNER_TEMP\graphene-ceiling-big"
          go test ./tests/ -tags=stress -run '^TestCeiling_' -v -count=1 -timeout 60m

  # Cross-compiled release binaries. Runs on every push so a build break on a
  # platform nobody develops on is caught when it is introduced rather than on
  # release day; uploads artifacts only for a tag.
  #
  # This job is the definition of a release build. build.sh and build.ps1 exist
  # to reproduce it locally, and a script that disagrees with the flags here is
  # a bug in the script.
  release:
    name: cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 so `git describe --tags` can see the tags. The build
      # reads the repository and never writes to it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every target
        # Invoked through `sh` rather than as ./build.sh. The script carries the
        # executable bit in the index, but a Windows checkout cannot represent
        # one on disk, so a commit made there can silently drop it — and the job
        # then fails with "Permission denied" for a reason that has nothing to
        # do with the build. Naming the interpreter costs nothing and cannot
        # regress.
        run: sh ./build.sh

      # Two builds of one commit must produce identical bytes. -trimpath and
      # -buildvcs=false are what make that true, and this is what proves they
      # are still doing their job — a reproducibility claim nobody checks is
      # not a claim.
      - name: Reproducible
        run: |
          DIST=dist2 sh ./build.sh >/dev/null
          if ! diff dist/SHA256SUMS dist2/SHA256SUMS; then
            echo "the same commit built twice produced different binaries"
            exit 1
          fi
          rm -rf dist2

      # The host binary is the only one this runner can execute. The other five
      # are proven to link, not to run.
      - name: Smoke test the host binary
        run: |
          ./dist/graphene_linux_amd64 version
          ./dist/graphene_linux_amd64 help > /dev/null
          ./dist/graphene_linux_amd64 -json version | grep -q '"schema"'

      - name: Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: graphene-binaries
          path: |
            dist/graphene_*
            dist/SHA256SUMS
